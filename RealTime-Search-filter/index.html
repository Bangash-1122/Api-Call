<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search and explore user profiles">
    <title>User Profiles</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="header">
            <h1>User Profiles</h1>
            <p>Search through the available profiles</p>

            <div class="search-box">
                <span class="search-icon">⌕</span>

                <input class="inp" id="searchInput" type="search" placeholder="Search users..." autocomplete="off" aria-label="Search users">
            </div>
        </header>

        <section id="cardContainer" class="card-container" aria-live="polite">
            <!-- JavaScript will generate user cards here -->
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
